[package]
name = "starcrypt"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Create and extract Cryptomator vaults without mounting"
license = "MIT"
readme = "README.md"
include = [
    "/src/**",
    "/tests/**/*.rs",
    "/tests/interop/*.py",
    "/tests/interop/*.java",
    "/tests/interop/README.md",
    "/tests/interop/reference/**",
    "/docs/**",
    "/scripts/*.py",
    "/scripts/*.sh",
    "/README.md",
    "/LICENSE",
    "/Cargo.lock",
    "/Cargo.toml",
]

[dependencies]
aes-gcm = "=0.10.3"
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
oxcrypt-core = { git = "https://github.com/agucova/oxcrypt", rev = "916864f66184dae6f97b0e97e02b879144fcfed6", default-features = false, features = ["async"] }
rpassword = "=7.5.5"
jsonwebtoken = { version = "=10.4.0", default-features = false, features = ["rust_crypto"] }
serde_json = "=1.0.154"
uuid = { version = "=1.29.2", features = ["v4"] }
zeroize = "=1.9.1"
tempfile = "=3.27.0"
time = "=0.3.55"
zip = { version = "=9.5.1", default-features = false, features = ["time", "deflate-flate2-zlib-rs"] }
sevenz-rust2 = { version = "=0.25.0", default-features = false, features = ["compress", "util"] }
indicatif = "=0.18.6"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

# Keep the real password work factor in tests without running ROMix unoptimized.
[profile.test.package.scrypt]
opt-level = 3
